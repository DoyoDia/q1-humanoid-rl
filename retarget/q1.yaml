# robot_retargeter config for 启元 Q1. Installed by retarget/make_model.py; the model it
# points at is generated there too. Mirrors config/robot/g1.yaml: same link layout, same
# IK weights and G1's per-keypoint orientation maps (Q1's link frames match G1's at zero
# pose, except hip roll -- see key_frame_config).
robot_xml_path: "asset/robot/q1/q1.xml"
verbose: True
render_debug: False
keypoints_path: "output_data/keypoints/q1/dance1_subject2_from_g1_keypoints.pkl"
joints_limit_offset_degrees:
  knee_joint: [10.0, 0.0]          # keep the knees off full extension, as for G1
knee_angle_offset_degrees: 15.0

robot_links:
  left_hip: [hips_sphere, left_hip_roll_link]
  left_thigh: [left_hip_roll_link, left_knee_link]
  left_calf: [left_knee_link, left_ankle_roll_link]

  right_hip: [hips_sphere, right_hip_roll_link]
  right_thigh: [right_hip_roll_link, right_knee_link]
  right_calf: [right_knee_link, right_ankle_roll_link]

  neck: [hips_sphere, neck_sphere]
  head: [neck_sphere, head_sphere]

  left_shoulder: [neck_sphere, left_shoulder_roll_link]
  left_arm: [left_shoulder_roll_link, left_elbow_link]
  left_fore_arm: [left_elbow_link, left_wrist_yaw_link]

  right_shoulder: [neck_sphere, right_shoulder_roll_link]
  right_arm: [right_shoulder_roll_link, right_elbow_link]
  right_fore_arm: [right_elbow_link, right_wrist_yaw_link]

contact_links: [left_foot_end_link, left_toe_link,
                right_foot_end_link, right_toe_link,
                left_wrist_yaw_link, right_wrist_yaw_link]

contact_vel_calculate_window: 6
contact_vel_threshold: 0.5
contact_height_threshold: 0.03    # G1 uses 0.05; Q1 is about half its height
contact_height_lpf_alpha: 0.15
contact_pos_fixed_factor: 15.0

ik_match_table: {
  "hips_mean": ["hips_sphere", 100, 0],

  "left_hip": ["left_hip_roll_link", 30, 3],
  "left_thigh": ["left_knee_link", 0.0, 3.0],
  "left_calf": ["left_ankle_roll_link", 30, 3],

  "right_hip": ["right_hip_roll_link", 30, 3],
  "right_thigh": ["right_knee_link", 0.0, 3.0],
  "right_calf": ["right_ankle_roll_link", 30, 3],

  "head": ["head_sphere", 0, 3.0],

  "left_shoulder": ["left_shoulder_roll_link", 30, 3],
  "left_arm": ["left_elbow_link", 10.0, 1],
  # Hand orientation weight 0 (G1: 1): G1 has three wrist joints, Q1 none, so G1's hand
  # orientation is not something Q1 can match. Measured on walk1: wrist error 14 mm at 0,
  # 17 mm at 1 -- either works once the key-frame maps are right.
  "left_fore_arm": ["left_wrist_yaw_link", 10, 0],

  "right_shoulder": ["right_shoulder_roll_link", 30, 3],
  "right_arm": ["right_elbow_link", 10.0, 1],
  "right_fore_arm": ["right_wrist_yaw_link", 10, 0]
}

# Copied verbatim from config/robot/g1.yaml: the maps are per keypoint (the arm entries
# differ from the leg ones) and depend only on the link frames, which Q1 shares with G1 at
# zero pose -- except the hip-roll offset below.
key_frame_config:
  hips_mean:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_up_leg:
    # G1's hip_roll_link frame is pitched -10 deg at zero pose, Q1's is not: undo it so
    # equal joint angles give equal targets.
    offset_deg_xyz: [0.0, 10.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_leg:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_foot:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_up_leg:
    # G1's hip_roll_link frame is pitched -10 deg at zero pose, Q1's is not: undo it so
    # equal joint angles give equal targets.
    offset_deg_xyz: [0.0, 10.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_leg:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_foot:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  shoulder_mean:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, 1.0, 0.0]
      z: [-1.0, 0.0, 0.0]
  left_fore_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [1.0, 0.0, 0.0]
      y: [0.0, 1.0, 0.0]
      z: [0.0, 0.0, 1.0]
  left_hand:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [1.0, 0.0, 0.0]
      y: [0.0, 1.0, 0.0]
      z: [0.0, 0.0, 1.0]
  right_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, -1.0, 0.0]
      z: [1.0, 0.0, 0.0]
  right_fore_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [-1.0, 0.0, 0.0]
      y: [0.0, -1.0, 0.0]
      z: [0.0, 0.0, 1.0]
  right_hand:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [-1.0, 0.0, 0.0]
      y: [0.0, -1.0, 0.0]
      z: [0.0, 0.0, 1.0]
  head:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
